version: '3.8'

services:
  nginx:
    build: ./nginx
    container_name: hotel_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - hotel-net

  app:
    build: ./app
    container_name: hotel_app
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=secretpassword
      - DB_NAME=hotel_db
      - DB_PORT=5432
    expose:
      - "3000"
    depends_on:
      - postgres
    networks:
      - hotel-net

  postgres:
    image: postgres:15-alpine
    container_name: hotel_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hotel-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    networks:
      - hotel-net

  prometheus:
    image: prom/prometheus:latest
    container_name: hotel_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - hotel-net

  grafana:
    image: grafana/grafana:latest
    container_name: hotel_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - hotel-net

  loki:
    image: grafana/loki:latest
    container_name: hotel_loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    networks:
      - hotel-net

  promtail:
    image: grafana/promtail:latest
    container_name: hotel_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - hotel-net

volumes:
  pgdata:

networks:
  hotel-net:
    driver: bridge